<header class="header">
  <div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center py-3">

      <div class="d-flex align-items-center">
        <button class="btn btn-outline-secondary me-3" (click)="toggleSidebar()">
          <i class="bi bi-list"></i>
        </button>
        <h1 class="h4 mb-0 text-dark">{{ pageTitle }}</h1>
      </div>

      <!-- Right Side -->
      <div class="d-flex align-items-center gap-3">
        <!-- Theme Toggle -->
        <button class="btn btn-light btn-icon" (click)="toggleTheme()" [title]="isDarkTheme ? 'Modo Claro' : 'Modo Escuro'">
          <i class="bi" [class.bi-sun]="!isDarkTheme" [class.bi-moon]="isDarkTheme"></i>
        </button>
        
        <button class="btn btn-light btn-icon">
          <i class="bi bi-bell"></i>
        </button>
