<div class="quick-actions-card">
  <div class="card-header">
    <h3 class="card-title">Ações Rápidas</h3>
  </div>
  
  <div class="actions-list">
    <!-- Adicionar Produto -->
    <button class="action-btn btn-primary">
      <div class="action-icon">
        <i class="bi bi-plus-lg"></i>
      </div>
      <div class="action-content">
        <span class="action-title">Adicionar Produto</span>
        <span class="action-description">Cadastrar novo produto no catálogo</span>
      </div>
      <i class="bi bi-arrow-right action-arrow"></i>
    </button>

    <!-- Criar Cupom -->
    <button class="action-btn btn-secondary">
      <div class="action-icon">
        <i class="bi bi-tag"></i>
      </div>
      <div class="action-content">
        <span class="action-title">Criar Cupom</span>
        <span class="action-description">Gerar novo cupom de desconto</span>
      </div>
      <i class="bi bi-arrow-right action-arrow"></i>
    </button>

    <!-- Cadastrar Site -->
    <button class="action-btn btn-success">
      <div class="action-icon">
        <i class="bi bi-globe"></i>
      </div>
      <div class="action-content">
        <span class="action-title">Cadastrar Site</span>
        <span class="action-description">Adicionar novo site à plataforma</span>
      </div>
      <i class="bi bi-arrow-right action-arrow"></i>
    </button>

    <!-- Gerenciar Clientes -->
    <button class="action-btn btn-info">
      <div class="action-icon">
        <i class="bi bi-people"></i>
      </div>
      <div class="action-content">
        <span class="action-title">Gerenciar Clientes</span>
        <span class="action-description">Visualizar e gerenciar clientes</span>
      </div>
      <i class="bi bi-arrow-right action-arrow"></i>
    </button>
  </div>
</div>
